{% extends "base.html" %}{% block title %}Notifications{% endblock %}{% block content %}<h1>Notifications</h1>{% for n in items %}<article><p>{{n.message}}</p>{% if not n.read_status %}<form method="post" action="{{url_for('read_notification',item_id=n.notification_id)}}">{{token()}}<button>Mark read</button></form>{% else %}<small>Read</small>{% endif %}</article>{% else %}<p class="panel">No notifications yet.</p>{% endfor %}{% endblock %}
